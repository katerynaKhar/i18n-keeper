name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Both platforms, because the tool compares and rewrites files byte for
    # byte and joins paths itself; a Windows-only or Linux-only assumption is
    # exactly the kind of thing that would otherwise ship unnoticed.
    # Node 20 is the floor declared in package.json, so it is tested too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The PHP parser is verified against the real interpreter, so the tests
      # need one. No extensions beyond the defaults are used.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: npm ci

      - run: npm test
